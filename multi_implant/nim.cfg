# Minimal Nimhawk Configuration
# Only essential settings to avoid cross-compilation issues

--define:puppyLibcurl
--define:noSignalHandler
--define:zippyNoSimd
--stackTrace:off
--lineTrace:off

# Disable ARM-specific optimizations for macOS cross-compilation
macosx.arm64.passC = "-DNO_ARM_NEON"
macosx.amd64.passC = "-DNO_SSE" 